{% extends "base.html" %}{% block content %}<div class="bg-mentor" style="padding:40px;"><div class="overlay" style="max-width:550px;margin:auto;"><h2>Senior Mentor Registration</h2><p>Passport Photo + Details</p><form method="POST" enctype="multipart/form-data"><input name="name" placeholder="Full Name" required><input name="branch" placeholder="Branch e.g. CSE" required><input name="year" placeholder="Year e.g. 2023 Passout / 4th Year" required><select name="status" required><option>Currently Pursuing</option><option>Passout</option><option>Alumni</option></select><input type="file" name="photo" accept="image/*" required><small>Passport Size Photo</small><input name="skills" placeholder="Skills e.g. DSA, Placement Guidance" required><input name="contact" placeholder="WhatsApp / Email" required><button class="btn-gold" type="submit">Register as Mentor</button></form></div></div>{% endblock %}
