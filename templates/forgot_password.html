{% extends "base.html" %}
{% block content %}
<div class="main-box" style="max-width:400px; text-align:center;">
<h2>🔑 Reset Password</h2>
<form method="POST" style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">
<input name="username" placeholder="Username / Email" required>
<input name="new_password" type="password" placeholder="Naya Password" required>
<button class="gold-btn" type="submit">Reset Karo</button>
</form>
<a href="/login" style="color:gold; display:block; margin-top:15px;">Back to Login</a>
</div>
{% endblock %}
