{% extends "base.html" %}
{% block content %}
<div class="main-box" style="max-width:500px; margin:30px auto; text-align:center;">
<h1 style="color:#FFD700; font-family:Georgia,serif;">Junior Registration</h1>
<p style="color:#ccc; margin-bottom:20px;">Find a Senior Mentor</p>
<form method="POST">
<input class="gold-input" name="name" placeholder="Full Name" required>
<input class="gold-input" name="branch" placeholder="Branch" required>
<input class="gold-input" name="year" placeholder="Year" required>
<input class="gold-input" name="interest" placeholder="Interest e.g. DSA, Placement" required>
<input class="gold-input" name="contact" placeholder="WhatsApp / Email" required>
<button class="gold-btn" style="width:100%; padding:14px;">Register as Junior ✨</button>
</form>
</div>
{% endblock %}
